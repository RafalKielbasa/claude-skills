<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 920" width="1300" height="920" role="img" aria-label="Przepływ informacji między Rafałem, kartami sesji w aplikacji desktop Claude Code, hookami i rejestrem, hubem, forkiem dialogu, Codexem i VS Code; strzałki opisane sondami D1–D11 z raportu sond hub-panel." font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1f2328">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="920" fill="#f8f9fb"/>

  <text x="30" y="42" font-size="16" font-weight="700">Przepływ informacji: aplikacja desktop + hub</text>

  <!-- Rafał -->
  <rect x="250" y="50" width="1010" height="40" rx="8" fill="#fff4d6" stroke="#bf8700" stroke-width="1.5"/>
  <text x="755" y="75" text-anchor="middle" font-size="15" font-weight="700">Rafał — czyta karty i odpowiada; wyłącznie on udziela zgód i odpowiada na bramki</text>

  <!-- Rafał <-> desktop app -->
  <line x1="300" y1="90" x2="300" y2="140" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="330" y1="140" x2="330" y2="90" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="345" y="110" font-size="11">prompt · bramka („OK”, „A”) · Allow/Deny · AskUserQuestion <tspan fill="#0969da" font-weight="700">[D4 D5 D6 D11]</tspan></text>
  <text x="345" y="130" font-size="11">status · pytania · wynik <tspan fill="#0969da" font-weight="700">[D1]</tspan></text>

  <!-- Rafał <-> hub -->
  <line x1="1150" y1="90" x2="1150" y2="140" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="1180" y1="140" x2="1180" y2="90" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="1135" y="110" font-size="11" text-anchor="end">„omówmy wynik sesji X” · „wyślij” · element dla Codexa</text>
  <text x="1135" y="130" font-size="11" text-anchor="end">przegląd · decyzje i prompt do przeglądu · komentarz Codexa</text>

  <!-- Rafał <-> VS Code (left route) -->
  <path d="M250,70 L225,70 L225,608 L250,608" fill="none" stroke="#57606a" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="212" y="340" font-size="11" text-anchor="middle" transform="rotate(-90 212 340)">przegląd diffów w edytorze</text>

  <!-- Desktop app container -->
  <rect x="250" y="140" width="360" height="400" rx="10" fill="#eaf2fc" stroke="#0969da" stroke-width="1.5"/>
  <text x="268" y="162" font-size="14" font-weight="700">Aplikacja desktop — jedno okno</text>
  <rect x="556" y="148" width="32" height="18" rx="4" fill="#0969da"/>
  <text x="572" y="161" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">D1</text>

  <g transform="translate(268,180)">
    <rect width="324" height="88" rx="6" fill="#ffffff" stroke="#8c959f"/>
    <text x="12" y="20" font-weight="700">Sesja A · repo-1</text>
    <text x="12" y="40" font-size="11">status: pracuje · czeka na decyzję · problem</text>
    <rect x="12" y="52" width="176" height="24" rx="4" fill="#ffffff" stroke="#8c959f" stroke-dasharray="3 2"/>
    <text x="20" y="68" font-size="11" fill="#57606a">pole odpowiedzi</text>
    <text x="312" y="68" font-size="11" text-anchor="end">Allow / Deny</text>
  </g>
  <g transform="translate(268,280)">
    <rect width="324" height="88" rx="6" fill="#ffffff" stroke="#8c959f"/>
    <text x="12" y="20" font-weight="700">Sesja B · repo-2</text>
    <text x="12" y="40" font-size="11">status: pracuje · czeka na decyzję · problem</text>
    <rect x="12" y="52" width="176" height="24" rx="4" fill="#ffffff" stroke="#8c959f" stroke-dasharray="3 2"/>
    <text x="20" y="68" font-size="11" fill="#57606a">pole odpowiedzi</text>
    <text x="312" y="68" font-size="11" text-anchor="end">Allow / Deny</text>
  </g>
  <g transform="translate(268,380)">
    <rect width="324" height="88" rx="6" fill="#ffffff" stroke="#8c959f"/>
    <text x="12" y="20" font-weight="700">Sesja C · repo-3</text>
    <text x="12" y="40" font-size="11">status: pracuje · czeka na decyzję · problem</text>
    <rect x="12" y="52" width="176" height="24" rx="4" fill="#ffffff" stroke="#8c959f" stroke-dasharray="3 2"/>
    <text x="20" y="68" font-size="11" fill="#57606a">pole odpowiedzi</text>
    <text x="312" y="68" font-size="11" text-anchor="end">Allow / Deny</text>
  </g>

  <rect x="268" y="480" width="324" height="44" rx="6" fill="none" stroke="#cf222e" stroke-dasharray="5 4"/>
  <text x="280" y="498" font-size="11">sesja uruchomiona przez hub (claude --bg):</text>
  <text x="280" y="514" font-size="11">niewidoczna w aplikacji desktop</text>
  <rect x="552" y="486" width="32" height="18" rx="4" fill="#cf222e"/>
  <text x="568" y="499" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">D9</text>

  <!-- VS Code and repositories -->
  <line x1="430" y1="540" x2="430" y2="580" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="440" y="565" font-size="11">link plik:linia <tspan fill="#0969da" font-weight="700">[D10]</tspan></text>
  <rect x="250" y="580" width="360" height="56" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="430" y="606" text-anchor="middle" font-weight="700">VS Code</text>
  <text x="430" y="624" text-anchor="middle" font-size="11">kod i diffy — przegląd zmian w edytorze</text>

  <rect x="250" y="680" width="360" height="56" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="430" y="706" text-anchor="middle" font-weight="700">Repozytoria na dysku</text>
  <text x="430" y="724" text-anchor="middle" font-size="11">repo-1 · repo-2 · repo-3 (fork i hub: tylko odczyt)</text>

  <!-- Hooks -->
  <line x1="610" y1="190" x2="660" y2="190" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="635" y="182" font-size="10" text-anchor="middle">zdarzenia</text>
  <rect x="660" y="160" width="240" height="60" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="780" y="182" text-anchor="middle" font-weight="700">Hooki globalne</text>
  <text x="780" y="200" text-anchor="middle" font-size="11">SessionStart · PostToolUse · Stop</text>

  <!-- Registry -->
  <line x1="780" y1="220" x2="780" y2="260" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="790" y="244" font-size="11">zapis</text>
  <rect x="660" y="260" width="240" height="80" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="780" y="284" text-anchor="middle" font-weight="700">Rejestr huba</text>
  <text x="780" y="302" text-anchor="middle" font-size="11" font-family="Consolas, Courier New, monospace">~/.claude/hub/registry/</text>
  <text x="780" y="322" text-anchor="middle" font-size="11">&lt;id&gt;.events.jsonl · &lt;id&gt;.last/</text>

  <!-- Registry -> hub watcher -->
  <line x1="900" y1="265" x2="960" y2="203" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="896" y="240" font-size="11" text-anchor="end">Monitor</text>
  <text x="896" y="254" font-size="11" text-anchor="end" fill="#0969da" font-weight="700">[D2 D4]</text>

  <!-- claude agents json -->
  <rect x="660" y="370" width="240" height="50" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="780" y="392" text-anchor="middle" font-family="Consolas, Courier New, monospace">claude agents --json</text>
  <text x="780" y="410" text-anchor="middle" font-size="11">nazwy i stan żywych sesji</text>
  <line x1="900" y1="395" x2="960" y2="263" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="896" y="362" font-size="11" text-anchor="end">nazwy sesji <tspan fill="#0969da" font-weight="700">[D3]</tspan></text>

  <!-- Hub -> fork -->
  <line x1="960" y1="323" x2="900" y2="478" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="896" y="436" font-size="11" text-anchor="end">HUB dialog start <tspan fill="#0969da" font-weight="700">[D8]</tspan></text>

  <!-- Fork -->
  <rect x="660" y="466" width="240" height="104" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="780" y="488" text-anchor="middle" font-weight="700">Fork dialogu</text>
  <text x="780" y="506" text-anchor="middle" font-size="10" font-family="Consolas, Courier New, monospace">claude --bg --resume &lt;id&gt; --fork-session</text>
  <text x="780" y="524" text-anchor="middle" font-size="11">czyta repo i snapshot git z context/</text>
  <text x="780" y="542" text-anchor="middle" font-size="11">pisze tylko do katalogu dialogu</text>
  <text x="780" y="560" text-anchor="middle" font-size="11">rola i --settings jak fork pisany (§6.5)</text>

  <!-- Fork -> repositories (read-only) -->
  <line x1="660" y1="530" x2="610" y2="695" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="650" y="592" font-size="11">czyta (tylko odczyt)</text>

  <!-- Fork -> dialog directory -->
  <line x1="780" y1="570" x2="780" y2="610" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="790" y="604" font-size="11">pisze</text>
  <rect x="660" y="610" width="240" height="100" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="780" y="632" text-anchor="middle" font-size="10" font-family="Consolas, Courier New, monospace">~/.claude/hub/projects/&lt;projekt&gt;/</text>
  <text x="780" y="648" text-anchor="middle" font-size="10" font-family="Consolas, Courier New, monospace">dialogs/&lt;data&gt;-&lt;slug&gt;/</text>
  <text x="780" y="670" text-anchor="middle" font-size="11">decisions.md · open-questions.md · prompt.md</text>
  <text x="780" y="688" text-anchor="middle" font-size="11">context/: git status, log, diff (read-only)</text>

  <!-- Dialog directory -> hub -->
  <line x1="900" y1="650" x2="960" y2="470" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="895" y="586" font-size="11" text-anchor="end">decyzje · prompt.md</text>

  <!-- Hub container -->
  <rect x="960" y="140" width="300" height="400" rx="10" fill="#f1ebfb" stroke="#8250df" stroke-width="1.5"/>
  <text x="1110" y="162" text-anchor="middle" font-size="14" font-weight="700">Hub — sesja Claude Code</text>

  <rect x="978" y="180" width="264" height="46" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="1110" y="198" text-anchor="middle" font-weight="700">Watcher (Monitor)</text>
  <text x="1110" y="216" text-anchor="middle" font-size="11">budzi hub na zdarzenia rejestru</text>

  <rect x="978" y="240" width="264" height="46" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="1110" y="258" text-anchor="middle" font-weight="700">Przegląd sesji</text>
  <text x="1110" y="276" text-anchor="middle" font-size="11">pracuje · skończyła · czeka na Rafała · problem</text>

  <rect x="978" y="300" width="264" height="46" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="1110" y="318" text-anchor="middle" font-weight="700">HUB dialog start / refresh</text>
  <text x="1110" y="336" text-anchor="middle" font-size="11">uruchamia fork, robi snapshot git</text>

  <rect x="978" y="360" width="264" height="46" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="1110" y="378" text-anchor="middle" font-weight="700">Konsultacja Codexa</text>
  <text x="1110" y="396" text-anchor="middle" font-size="11">codex exec -s read-only, wątek na element</text>

  <rect x="978" y="420" width="264" height="46" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="1110" y="438" text-anchor="middle" font-weight="700">Wysyłka</text>
  <text x="1110" y="456" text-anchor="middle" font-size="11">SendMessage dopiero po Twoim „wyślij”</text>

  <rect x="978" y="480" width="264" height="48" rx="6" fill="#ffffff" stroke="#8c959f" stroke-dasharray="3 2"/>
  <text x="1110" y="496" text-anchor="middle" font-size="10">pisze tylko w ~/.claude/hub · w repo tylko git read-only</text>
  <text x="1110" y="514" text-anchor="middle" font-size="10">nic nie nasłuchuje w sieci · nigdy nie odpowiada na zgody</text>

  <!-- Hub -> desktop sessions (SendMessage) -->
  <line x1="960" y1="443" x2="610" y2="443" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="620" y="456" font-size="11">SendMessage po „wyślij” (nie zgoda) <tspan fill="#0969da" font-weight="700">[D7]</tspan></text>

  <!-- Hub <-> Codex -->
  <line x1="1090" y1="540" x2="1090" y2="600" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="1130" y1="600" x2="1130" y2="540" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="1080" y="575" font-size="11" text-anchor="end">element do oceny</text>
  <text x="1140" y="575" font-size="11">komentarz</text>
  <rect x="960" y="600" width="300" height="56" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="1110" y="626" text-anchor="middle" font-weight="700">Codex</text>
  <text x="1110" y="644" text-anchor="middle" font-size="11">druga opinia: sandbox read-only, tylko komentarze</text>

  <!-- Legend -->
  <text x="250" y="790" font-weight="700">Jak czytać</text>
  <text x="250" y="812" font-size="11"><tspan fill="#0969da" font-weight="700">[Dn]</tspan> — sonda z raportu 2026-10-18-hub-panel-probes.md, która sprawdza ten przepływ</text>
  <line x1="250" y1="826" x2="290" y2="826" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="300" y="830" font-size="11">oczekiwana luka wg dokumentacji Claude Code (D9)</text>
  <text x="250" y="854" font-size="11">Granice: zgody (Allow/Deny) i odpowiedzi na bramki tylko z karty — hub nigdy ich nie przekazuje; hub pisze tylko w ~/.claude/hub;</text>
  <text x="250" y="872" font-size="11">fork pisze tylko w swoim katalogu dialogu; w repozytoriach tylko git read-only; nic nie nasłuchuje w sieci;</text>
  <text x="250" y="890" font-size="11">prompt z huba (SendMessage) dociera do sesji jako wiadomość od innej sesji, nigdy jako Twoja zgoda.</text>
  <text x="250" y="910" font-size="10" fill="#57606a">Stan po brainstormingu 2026-10-18 — decyzja „Kształt panelu”, wariant A: próba z aplikacją desktop bez budowy panelu.</text>
</svg>
